<script src="script.js"></script>
<!--The location of the script tag in the HTML document can affect how web page will behave. 
If the script tag is in the head element means that browser will execute the script before rendering HTML content. 
It can delay rendering of the page. 
If the script tag is at the beginning of the body element means that browser will execute the script after parsing some of the HTML content. 
It can delay the rendering of some part of the page. 
Script tag can be placed at the end of the body element. It means that the browser will execute the script after parsing and rendering all of the HTML content. 
It can improve the perceived performance of the page, but it can delay execution of the script.
The placement of <script> tags in an HTML document depends on the purpose of the script.
    
The defer attribute tells the browser to download an external JavaScript file without
stopping HTML parsing and execute it only after the HTML document has been completely parsed-->
